# Backlight
# Driven by device/media.yaml's speaker_state / office_presence logic
# (the original template's own presence-based screensaver binary_sensor,
# pointed at a nonexistent entity, was removed from here as dead weight).
switch:
  - platform: template
    id: backlight
    restore_mode: ALWAYS_ON
    internal: true
    turn_on_action:
      - light.turn_on: display_backlight
    turn_off_action:
      - light.turn_off: display_backlight
