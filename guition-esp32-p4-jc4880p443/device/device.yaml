# Designed for guition-esp32-p4-jc4880p443
esp32:
  variant: esp32p4
  flash_size: 16MB
  engineering_sample: true
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes

# Esphome
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  area: ${room}

# Secondary ESP32-C6 device for connectivity
esp32_hosted:
  active_high: true
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

# Video memory
psram:
  speed: 200MHz

# Over the Air Updates
ota:
  platform: esphome

# Enable Home Assistant API
api:

# Enable logging
logger:

# Power management
esp_ldo:
  - channel: 3
    voltage: 2.5V

# Backlight
output:
  - platform: ledc
    id: backlight_output
    pin: GPIO23
    frequency: 100Hz
    inverted: false
    min_power: 0.0
    max_power: 0.8

light:
  - platform: monochromatic
    output: backlight_output
    name: Screen
    icon: mdi:television
    entity_category: config
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

# I2C
i2c:
  sda: GPIO7
  scl: GPIO8
  scan: false
  frequency: 400kHz

# Touchscreen
# on_touch wakes the display - references id(speaker_state)/id(office_presence)/
# dim_after_delay/backlight, all defined in device/media.yaml. That's fine:
# referencing another file's id inside a lambda is a plain C++ symbol
# reference at compile time, unrelated to (and much more reliable than) the
# YAML-level "supplement this component from another package file by
# matching id:" mechanism, which turned out to be fragile here.
touchscreen:
  - platform: gt911
    id: my_touchscreen
    display: my_display
    on_touch:
      - logger.log: "[backlight] Touch detected - turning backlight on"
      - switch.turn_on: backlight
      # Only restart the dim countdown if NEITHER playing nor present -
      # if presence is accurate, touching implies presence is already on
      # and this branch won't fire, but this covers presence-sensor gaps.
      - if:
          condition:
            lambda: 'return id(speaker_state).state != "playing" && !id(office_presence).state;'
          then:
            - logger.log: "[backlight] Not playing and no presence - (re)starting 3min dim countdown after touch"
            - script.execute: dim_after_delay

# Display
display:
  - platform: mipi_dsi
    id: my_display
    model: JC4880P443
