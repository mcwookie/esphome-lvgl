lvgl:
  pages:
    # Redesigned for the 800x480 landscape canvas (rotation: 90 above turns
    # the native 480x800 portrait panel sideways). Everything is shorter and
    # the now-playing section is a ROW (art beside text) instead of a COLUMN
    # (art above text), since height is now the scarce dimension, not width.
    - id: music_page
      layout:
        type: flex
        flex_flow: column
        pad_row: 8
      width: 100%
      scrollable: false
      bg_color: Black
      bg_opa: cover
      pad_top: 24
      pad_bottom: 4
      pad_left: 10
      pad_right: 10

      widgets:
        # --- Player selector --- (height 64)
        # pad_all overridden to 4 (theme default is 14px) - icon_font glyphs
        # are 48px tall, and the theme's default padding was eating enough
        # of the button's height that icons bled past the button into the
        # section below.
        - obj:
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            width: 100%
            height: 70
            pad_all: 0
            scrollable: false
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - button:
                  id: player_roku_button
                  checkable: true
                  height: 64
                  width: 170
                  pad_all: 2
                  styles: control
                  widgets:
                    - label: {text_font: $icon_font, text: "\U000F0502", align: LEFT_MID}   # mdi-television
                    - label: {text: "Office Roku", align: RIGHT_MID}
                  on_press:
                    - lambda: 'id(current_player) = "media_player.roku_express_4k_office";'
                    - lvgl.widget.update: {id: player_roku_button, state: {checked: true}}
                    - lvgl.widget.update: {id: player_macmini_button, state: {checked: false}}
                    - script.execute: refresh_display
              - button:
                  id: player_macmini_button
                  checkable: true
                  height: 64
                  width: 170
                  pad_all: 2
                  styles: control
                  widgets:
                    - label: {text_font: $icon_font, text: "\U000F0322", align: LEFT_MID}   # mdi-laptop
                    - label: {text: "Mac mini", align: RIGHT_MID}
                  on_press:
                    - lambda: 'id(current_player) = "media_player.brians_mac_mini";'
                    - lvgl.widget.update: {id: player_roku_button, state: {checked: false}}
                    - lvgl.widget.update: {id: player_macmini_button, state: {checked: true}}
                    - script.execute: refresh_display

        # --- Now playing --- (row: art beside text, height 104)
        - obj:
            layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center, pad_column: 14}
            width: 100%
            height: 100
            pad_all: 0
            scrollable: false
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - image:
                  id: cover_art_widget
                  src: cover_art
                  width: 96
                  height: 96
              - obj:
                  layout: {type: flex, flex_flow: column, flex_align_cross: start}
                  flex_grow: 1
                  height: SIZE_CONTENT
                  scrollable: false
                  bg_opa: TRANSP
                  border_width: 0
                  widgets:
                    - label:
                        id: media_title_label
                        text: "Nothing playing"
                        text_font: label_font
                        text_color: 0xFFFFFF
                    - label:
                        id: media_artist_label
                        text: ""
                        text_font: label_font
                        text_color: 0xAAAAAA

        # --- Transport controls --- (height 68)
        # NOTE: homeassistant.action's `data:` fields must be STATIC. Runtime
        # (lambda-derived) values have to go through `variables:` + a Jinja
        # `data_template:` string that Home Assistant renders on receipt -
        # putting `!lambda` directly under `data:` silently does nothing.
        - obj:
            layout: {type: flex, flex_flow: row, flex_align_main: center, flex_align_cross: center, pad_column: 20}
            width: 100%
            height: 78
            pad_all: 0
            scrollable: false
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - button:
                  styles: control
                  height: 70
                  width: 70
                  pad_all: 2
                  widgets:
                    - label: {text_font: $icon_font, text: "\U000F04AE", align: center}   # skip-previous
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_previous_track
                        variables:
                          target_player: !lambda 'return id(current_player);'
                        data_template:
                          entity_id: "{{ target_player }}"
              - button:
                  id: play_pause_button
                  styles: control
                  height: 70
                  width: 70
                  pad_all: 2
                  widgets:
                    - label: {id: play_pause_icon, text_font: $icon_font, text: "\U000F040A", align: center}
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_play_pause
                        variables:
                          target_player: !lambda 'return id(current_player);'
                        data_template:
                          entity_id: "{{ target_player }}"
              - button:
                  styles: control
                  height: 70
                  width: 70
                  pad_all: 2
                  widgets:
                    - label: {text_font: $icon_font, text: "\U000F04AD", align: center}   # skip-next
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_next_track
                        variables:
                          target_player: !lambda 'return id(current_player);'
                        data_template:
                          entity_id: "{{ target_player }}"

        # --- Volume --- (height 20)
        - slider:
            id: volume_slider
            width: 90%
            height: 20
            min_value: 0
            max_value: 100
            value: 50
            align: center
            on_release:
              - homeassistant.action:
                  action: media_player.volume_set
                  variables:
                    target_player: !lambda 'return id(current_player);'
                    vol_value: !lambda 'return x / 100.0f;'
                  data_template:
                    entity_id: "{{ target_player }}"
                    volume_level: "{{ vol_value }}"

        # --- Playlist selector (all Music Assistant playlists) ---
        - obj:
            layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 10}
            width: 100%
            height: SIZE_CONTENT
            pad_all: 0
            scrollable: false
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - label:
                  text: "Playlist:"
                  text_font: label_font
                  text_color: 0xFFFFFF
              - dropdown:
                  id: playlist_dropdown
                  flex_grow: 1
                  height: 48
                  text_font: label_font
                  bg_color: 0x313131
                  text_color: 0xFFFFFF
                  dropdown_list:
                    bg_color: 0x313131
                    text_color: 0xFFFFFF
                    selected:
                      bg_color: 0xFF8C00
                      text_color: 0xFFFFFF
                  options:
                  - "(untitled)"
                  - "The 50 Greatest Pieces Of Classical Music"
