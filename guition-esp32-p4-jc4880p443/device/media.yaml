# Music Assistant control page for guition-esp32-p4-jc4880p443
# Add this file as device/media.yaml in your fork of jtenniswood/esphome-lvgl,
# then add `media: !include device/media.yaml` to package.yaml (see instructions).
#
# EDIT THIS: point at your actual LAN-reachable Home Assistant URL (not 127.0.0.1 -
# that only resolves inside HA's own container/host, not from another device on your network).
substitutions:
  ha_url: "http://192.168.1.10:8123"   # <-- CHANGE ME to your real Home Assistant LAN address

# Which media_player entity is currently being controlled/displayed.
globals:
  - id: current_player
    type: std::string
    restore_value: false
    initial_value: '"media_player.roku_express_4k_office"'

# Required by online_image below - performs the actual HTTP(S) fetch.
# verify_ssl: false avoids needing to bundle CA certs for the various https
# album-art CDNs (Spotify's i.scdn.co, mosaic.scdn.co, etc.) - acceptable for
# fetching public artwork on a local device.
http_request:
  verify_ssl: false

# Cover art image, repointed at runtime via online_image.set_url.
# format: JPEG matches real Spotify/MA art (always jpg). This ESPHome
# version (2026.7.3) doesn't support format: AUTO (added later) so the
# placeholder URL below must itself be a real JPEG - httpbin's test
# endpoint always returns one, unlike the HA favicon (a PNG despite the
# generic-looking URL, which failed to decode under format: JPEG before).
# on_download_finished is required: a successful online_image download does
# NOT automatically redraw the LVGL image widget that references it - you
# have to explicitly re-point the widget's src at the same id to force it
# to redraw with the freshly-decoded bytes.
image:
  - platform: online_image
    id: cover_art
    url: "https://httpbin.org/image/jpeg"
    format: JPEG
    type: RGB565
    resize: 96x96
    on_download_finished:
      - lvgl.image.update:
          id: cover_art_widget
          src: cover_art

# One text_sensor/sensor per attribute, per player. Cheap to keep both live;
# refresh_display() below picks whichever one matches the current selection.
text_sensor:
  - platform: homeassistant
    id: roku_state
    entity_id: media_player.roku_express_4k_office
    on_value:
      - script.execute: refresh_display
  - platform: homeassistant
    id: roku_media_title
    entity_id: media_player.roku_express_4k_office
    attribute: media_title
    on_value:
      - script.execute: refresh_display
  - platform: homeassistant
    id: roku_media_artist
    entity_id: media_player.roku_express_4k_office
    attribute: media_artist
    on_value:
      - script.execute: refresh_display
  - platform: homeassistant
    id: roku_entity_picture
    entity_id: media_player.roku_express_4k_office
    attribute: entity_picture
    on_value:
      - script.execute: refresh_display

  - platform: homeassistant
    id: macmini_state
    entity_id: media_player.brians_mac_mini
    on_value:
      - script.execute: refresh_display
  - platform: homeassistant
    id: macmini_media_title
    entity_id: media_player.brians_mac_mini
    attribute: media_title
    on_value:
      - script.execute: refresh_display
  - platform: homeassistant
    id: macmini_media_artist
    entity_id: media_player.brians_mac_mini
    attribute: media_artist
    on_value:
      - script.execute: refresh_display
  - platform: homeassistant
    id: macmini_entity_picture
    entity_id: media_player.brians_mac_mini
    attribute: entity_picture
    on_value:
      - script.execute: refresh_display

sensor:
  - platform: homeassistant
    id: roku_volume
    entity_id: media_player.roku_express_4k_office
    attribute: volume_level
    on_value:
      - script.execute: refresh_display
  - platform: homeassistant
    id: macmini_volume
    entity_id: media_player.brians_mac_mini
    attribute: volume_level
    on_value:
      - script.execute: refresh_display

# Pulls whichever player's cached sensor values match id(current_player) onto
# the shared widgets. Called on every sensor update AND on player-switch.
# (These stay as plain C++ lambdas - refresh_display runs entirely inside the
# device, no Home Assistant service call involved, so inline !lambda is fine here.)
script:
  - id: refresh_display
    then:
      - lvgl.label.update:
          id: media_title_label
          text: !lambda |-
            return (id(current_player) == "media_player.roku_express_4k_office")
              ? id(roku_media_title).state : id(macmini_media_title).state;
      - lvgl.label.update:
          id: media_artist_label
          text: !lambda |-
            return (id(current_player) == "media_player.roku_express_4k_office")
              ? id(roku_media_artist).state : id(macmini_media_artist).state;
      - lvgl.label.update:
          id: play_pause_icon
          text: !lambda |-
            std::string st = (id(current_player) == "media_player.roku_express_4k_office")
              ? id(roku_state).state : id(macmini_state).state;
            return (st == "playing") ? "\U000F03E4" : "\U000F040A";
      - lvgl.slider.update:
          id: volume_slider
          value: !lambda |-
            float v = (id(current_player) == "media_player.roku_express_4k_office")
              ? id(roku_volume).state : id(macmini_volume).state;
            return (int)(v * 100);
      - online_image.set_url:
          id: cover_art
          url: !lambda |-
            std::string pic = (id(current_player) == "media_player.roku_express_4k_office")
              ? id(roku_entity_picture).state : id(macmini_entity_picture).state;
            if (!pic.empty() && pic.rfind("http", 0) != 0) {
              pic = std::string("${ha_url}") + pic;
            }
            return pic;

# Wraps the playlist_dropdown widget as a proper select entity, exposing its
# current choice via the on_value trigger's `x` (the selected option text) -
# same convention as every other ESPHome domain's on_value trigger.
select:
  - platform: lvgl
    widget: playlist_dropdown
    id: playlist_select
    on_value:
      - homeassistant.action:
          action: media_player.play_media
          variables:
            target_player: !lambda 'return id(current_player);'
            playlist_id: !lambda |-
              if (x == "(untitled)") return std::string("library://playlist/72");
              else if (x == "The 50 Greatest Pieces Of Classical Music") return std::string("library://playlist/102");
