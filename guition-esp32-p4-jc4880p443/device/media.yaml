# Music Assistant control page for guition-esp32-p4-jc4880p443
# Add this file as device/media.yaml in your fork of jtenniswood/esphome-lvgl,
# then add `media: !include device/media.yaml` to package.yaml (see instructions).
#
# EDIT THIS: point at your actual LAN-reachable Home Assistant URL (not 127.0.0.1 -
# that only resolves inside HA's own container/host, not from another device on your network).
substitutions:
  ha_url: "http://192.168.20.50:8123"   # <-- CHANGE ME to your real Home Assistant LAN address

# Which media_player entity is currently being controlled/displayed.
globals:
  - id: current_player
    type: std::string
    restore_value: false
    initial_value: '"media_player.roku_express_4k_office"'

# Required by online_image below - performs the actual HTTP(S) fetch.
# verify_ssl: false avoids needing to bundle CA certs for the various https
# album-art CDNs (Spotify's i.scdn.co, mosaic.scdn.co, etc.) - acceptable for
# fetching public artwork on a local device.
http_request:
  verify_ssl: false

# Cover art image, repointed at runtime via online_image.set_url
image:
  - platform: online_image
    id: cover_art
    url: "https://www.home-assistant.io/images/favicon-192x192-full.png"
    format: JPEG
    type: RGB565
    resize: 96x96

# One text_sensor/sensor per attribute, per player. Cheap to keep both live;
# refresh_display() below picks whichever one matches the current selection.
text_sensor:
  - platform: homeassistant
    id: roku_state
    entity_id: media_player.roku_express_4k_office
    on_value:
      - script.execute: refresh_display
  - platform: homeassistant
    id: roku_media_title
    entity_id: media_player.roku_express_4k_office
    attribute: media_title
    on_value:
      - script.execute: refresh_display
  - platform: homeassistant
    id: roku_media_artist
    entity_id: media_player.roku_express_4k_office
    attribute: media_artist
    on_value:
      - script.execute: refresh_display
  - platform: homeassistant
    id: roku_entity_picture
    entity_id: media_player.roku_express_4k_office
    attribute: entity_picture
    on_value:
      - script.execute: refresh_display

  - platform: homeassistant
    id: macmini_state
    entity_id: media_player.brians_mac_mini
    on_value:
      - script.execute: refresh_display
  - platform: homeassistant
    id: macmini_media_title
    entity_id: media_player.brians_mac_mini
    attribute: media_title
    on_value:
      - script.execute: refresh_display
  - platform: homeassistant
    id: macmini_media_artist
    entity_id: media_player.brians_mac_mini
    attribute: media_artist
    on_value:
      - script.execute: refresh_display
  - platform: homeassistant
    id: macmini_entity_picture
    entity_id: media_player.brians_mac_mini
    attribute: entity_picture
    on_value:
      - script.execute: refresh_display

sensor:
  - platform: homeassistant
    id: roku_volume
    entity_id: media_player.roku_express_4k_office
    attribute: volume_level
    on_value:
      - script.execute: refresh_display
  - platform: homeassistant
    id: macmini_volume
    entity_id: media_player.brians_mac_mini
    attribute: volume_level
    on_value:
      - script.execute: refresh_display

# Pulls whichever player's cached sensor values match id(current_player) onto
# the shared widgets. Called on every sensor update AND on player-switch.
# (These stay as plain C++ lambdas - refresh_display runs entirely inside the
# device, no Home Assistant service call involved, so inline !lambda is fine here.)
script:
  - id: refresh_display
    then:
      - lvgl.label.update:
          id: media_title_label
          text: !lambda |-
            return (id(current_player) == "media_player.roku_express_4k_office")
              ? id(roku_media_title).state : id(macmini_media_title).state;
      - lvgl.label.update:
          id: media_artist_label
          text: !lambda |-
            return (id(current_player) == "media_player.roku_express_4k_office")
              ? id(roku_media_artist).state : id(macmini_media_artist).state;
      - lvgl.label.update:
          id: play_pause_icon
          text: !lambda |-
            std::string st = (id(current_player) == "media_player.roku_express_4k_office")
              ? id(roku_state).state : id(macmini_state).state;
            return (st == "playing") ? "\U000F03E4" : "\U000F040A";
      - lvgl.slider.update:
          id: volume_slider
          value: !lambda |-
            float v = (id(current_player) == "media_player.roku_express_4k_office")
              ? id(roku_volume).state : id(macmini_volume).state;
            return (int)(v * 100);
      - online_image.set_url:
          id: cover_art
          url: !lambda |-
            std::string pic = (id(current_player) == "media_player.roku_express_4k_office")
              ? id(roku_entity_picture).state : id(macmini_entity_picture).state;
            if (!pic.empty() && pic.rfind("http", 0) != 0) {
              pic = std::string("${ha_url}") + pic;
            }
            return pic;

lvgl:
  pages:
    # Redesigned for the 800x480 landscape canvas (rotation: 90 above turns
    # the native 480x800 portrait panel sideways). Everything is shorter and
    # the now-playing section is a ROW (art beside text) instead of a COLUMN
    # (art above text), since height is now the scarce dimension, not width.
    - id: music_page
      layout:
        type: flex
        flex_flow: column
        pad_row: 6
      width: 100%
      scrollable: false
      bg_color: Black
      bg_opa: cover
      pad_top: 24
      pad_bottom: 4
      pad_left: 10
      pad_right: 10

      widgets:
        # --- Player selector --- (height 40)
        - obj:
            layout: {type: flex, flex_flow: row, pad_column: 10}
            width: 100%
            height: 40
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - button:
                  id: player_roku_button
                  checkable: true
                  height: 36
                  width: 170
                  styles: control
                  widgets:
                    - label: {text_font: $icon_font, text: "\U000F0502", align: LEFT_MID}   # mdi-television
                    - label: {text: "Office Roku", align: RIGHT_MID}
                  on_press:
                    - lambda: 'id(current_player) = "media_player.roku_express_4k_office";'
                    - lvgl.widget.update: {id: player_roku_button, state: {checked: true}}
                    - lvgl.widget.update: {id: player_macmini_button, state: {checked: false}}
                    - script.execute: refresh_display
              - button:
                  id: player_macmini_button
                  checkable: true
                  height: 36
                  width: 170
                  styles: control
                  widgets:
                    - label: {text_font: $icon_font, text: "\U000F0322", align: LEFT_MID}   # mdi-laptop
                    - label: {text: "Mac mini", align: RIGHT_MID}
                  on_press:
                    - lambda: 'id(current_player) = "media_player.brians_mac_mini";'
                    - lvgl.widget.update: {id: player_roku_button, state: {checked: false}}
                    - lvgl.widget.update: {id: player_macmini_button, state: {checked: true}}
                    - script.execute: refresh_display

        # --- Now playing --- (row: art beside text, height 96)
        - obj:
            layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center, pad_column: 14}
            width: 100%
            height: 96
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - image:
                  id: cover_art_widget
                  src: cover_art
                  width: 96
                  height: 96
              - obj:
                  layout: {type: flex, flex_flow: column, flex_align_cross: start}
                  flex_grow: 1
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  widgets:
                    - label:
                        id: media_title_label
                        text: "Nothing playing"
                        text_font: label_font
                        text_color: 0xFFFFFF
                    - label:
                        id: media_artist_label
                        text: ""
                        text_font: label_font
                        text_color: 0xAAAAAA

        # --- Transport controls --- (height 56)
        # NOTE: homeassistant.action's `data:` fields must be STATIC. Runtime
        # (lambda-derived) values have to go through `variables:` + a Jinja
        # `data_template:` string that Home Assistant renders on receipt -
        # putting `!lambda` directly under `data:` silently does nothing.
        - obj:
            layout: {type: flex, flex_flow: row, flex_align_main: center, pad_column: 20}
            width: 100%
            height: 56
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - button:
                  styles: control
                  height: 56
                  width: 56
                  widgets:
                    - label: {text_font: $icon_font, text: "\U000F04AE", align: center}   # skip-previous
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_previous_track
                        variables:
                          target_player: !lambda 'return id(current_player);'
                        data_template:
                          entity_id: "{{ target_player }}"
              - button:
                  id: play_pause_button
                  styles: control
                  height: 56
                  width: 56
                  widgets:
                    - label: {id: play_pause_icon, text_font: $icon_font, text: "\U000F040A", align: center}
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_play_pause
                        variables:
                          target_player: !lambda 'return id(current_player);'
                        data_template:
                          entity_id: "{{ target_player }}"
              - button:
                  styles: control
                  height: 56
                  width: 56
                  widgets:
                    - label: {text_font: $icon_font, text: "\U000F04AD", align: center}   # skip-next
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_next_track
                        variables:
                          target_player: !lambda 'return id(current_player);'
                        data_template:
                          entity_id: "{{ target_player }}"

        # --- Volume --- (height 20)
        - slider:
            id: volume_slider
            width: 90%
            height: 20
            min_value: 0
            max_value: 100
            value: 50
            align: center
            on_release:
              - homeassistant.action:
                  action: media_player.volume_set
                  variables:
                    target_player: !lambda 'return id(current_player);'
                    vol_value: !lambda 'return x / 100.0f;'
                  data_template:
                    entity_id: "{{ target_player }}"
                    volume_level: "{{ vol_value }}"

        # --- Playlist shortcuts (Music Assistant library IDs) --- (48px rows)
        - obj:
            layout: {type: flex, flex_flow: row_wrap, pad_row: 6, pad_column: 6}
            width: 100%
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - button:
                  styles: control
                  height: 48
                  width: 128
                  widgets:
                    - label: {text: "Megadeth", align: center}
                  on_click:
                    - homeassistant.action:
                        action: media_player.play_media
                        variables:
                          target_player: !lambda 'return id(current_player);'
                        data_template:
                          entity_id: "{{ target_player }}"
                          media_content_type: "playlist"
                          media_content_id: "library://playlist/11"
              - button:
                  styles: control
                  height: 48
                  width: 128
                  widgets:
                    - label: {text: "Avenged Sevenfold", align: center}
                  on_click:
                    - homeassistant.action:
                        action: media_player.play_media
                        variables:
                          target_player: !lambda 'return id(current_player);'
                        data_template:
                          entity_id: "{{ target_player }}"
                          media_content_type: "playlist"
                          media_content_id: "library://playlist/26"
              - button:
                  styles: control
                  height: 48
                  width: 128
                  widgets:
                    - label: {text: "The Killers", align: center}
                  on_click:
                    - homeassistant.action:
                        action: media_player.play_media
                        variables:
                          target_player: !lambda 'return id(current_player);'
                        data_template:
                          entity_id: "{{ target_player }}"
                          media_content_type: "playlist"
                          media_content_id: "library://playlist/28"
              - button:
                  styles: control
                  height: 48
                  width: 128
                  widgets:
                    - label: {text: "Good Stuff", align: center}
                  on_click:
                    - homeassistant.action:
                        action: media_player.play_media
                        variables:
                          target_player: !lambda 'return id(current_player);'
                        data_template:
                          entity_id: "{{ target_player }}"
                          media_content_type: "playlist"
                          media_content_id: "library://playlist/27"
              - button:
                  styles: control
                  height: 48
                  width: 128
                  widgets:
                    - label: {text: "Metallica", align: center}
                  on_click:
                    - homeassistant.action:
                        action: media_player.play_media
                        variables:
                          target_player: !lambda 'return id(current_player);'
                        data_template:
                          entity_id: "{{ target_player }}"
                          media_content_type: "playlist"
                          media_content_id: "library://playlist/23"
              - button:
                  styles: control
                  height: 48
                  width: 128
                  widgets:
                    - label: {text: "Muse", align: center}
                  on_click:
                    - homeassistant.action:
                        action: media_player.play_media
                        variables:
                          target_player: !lambda 'return id(current_player);'
                        data_template:
                          entity_id: "{{ target_player }}"
                          media_content_type: "playlist"
                          media_content_id: "library://playlist/135"
