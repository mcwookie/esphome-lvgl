# Music Assistant control page for guition-esp32-p4-jc4880p443
# Add this file as device/media.yaml in your fork of jtenniswood/esphome-lvgl,
# then add `media: !include device/media.yaml` to package.yaml (see instructions).
#
# EDIT THIS: point at your actual LAN-reachable Home Assistant URL (not 127.0.0.1 -
# that only resolves inside HA's own container/host, not from another device on your network).
substitutions:
  ha_url: "http://192.168.1.10:8123"   # <-- CHANGE ME to your real Home Assistant LAN address

# Single-player build: this panel now controls only media_player.loud_esp32
# ("office-desk-speaker"). No player-select UI or per-player branching is
# needed - if you add a second controllable player later, reintroduce the
# current_player global + player-select row + per-player sensor sets.

# Required by online_image below - performs the actual HTTP(S) fetch.
# verify_ssl: false avoids needing to bundle CA certs for the various https
# album-art CDNs (Spotify's i.scdn.co, mosaic.scdn.co, etc.) - acceptable for
# fetching public artwork on a local device.
http_request:
  verify_ssl: false

# Cover art image, repointed at runtime via online_image.set_url.
# format: JPEG matches real Spotify/MA art (always jpg). This ESPHome
# version (2026.7.3) doesn't support format: AUTO (added later) so the
# placeholder URL below must itself be a real JPEG - httpbin's test
# endpoint always returns one, unlike the HA favicon (a PNG despite the
# generic-looking URL, which failed to decode under format: JPEG before).
# on_download_finished is required: a successful online_image download does
# NOT automatically redraw the LVGL image widget that references it - you
# have to explicitly re-point the widget's src at the same id to force it
# to redraw with the freshly-decoded bytes.
image:
  - platform: online_image
    id: cover_art
    url: "https://httpbin.org/image/jpeg"
    format: JPEG
    type: RGB565
    resize: 96x96
    on_download_finished:
      - lvgl.image.update:
          id: cover_art_widget
          src: cover_art

text_sensor:
  - platform: homeassistant
    id: speaker_state
    entity_id: media_player.loud_esp32
    on_value:
      - script.execute: refresh_display
  - platform: homeassistant
    id: speaker_media_title
    entity_id: media_player.loud_esp32
    attribute: media_title
    on_value:
      - script.execute: refresh_display
  - platform: homeassistant
    id: speaker_media_artist
    entity_id: media_player.loud_esp32
    attribute: media_artist
    on_value:
      - script.execute: refresh_display
  - platform: homeassistant
    id: speaker_entity_picture
    entity_id: media_player.loud_esp32
    attribute: entity_picture
    on_value:
      - script.execute: refresh_display

sensor:
  - platform: homeassistant
    id: speaker_volume
    entity_id: media_player.loud_esp32
    attribute: volume_level
    on_value:
      - script.execute: refresh_display

# Pulls the current sensor values onto the shared widgets. Called on every
# sensor update. (These stay as plain C++ lambdas - refresh_display runs
# entirely inside the device, no Home Assistant service call involved, so
# inline !lambda is fine here.)
script:
  - id: refresh_display
    then:
      - lvgl.label.update:
          id: media_title_label
          text: !lambda 'return id(speaker_media_title).state;'
      - lvgl.label.update:
          id: media_artist_label
          text: !lambda 'return id(speaker_media_artist).state;'
      - lvgl.label.update:
          id: play_pause_icon
          text: !lambda |-
            return (id(speaker_state).state == "playing") ? std::string("\U000F03E4") : std::string("\U000F040A");
      - lvgl.slider.update:
          id: volume_slider
          value: !lambda 'return (int)(id(speaker_volume).state * 100);'
      - online_image.set_url:
          id: cover_art
          url: !lambda |-
            std::string pic = id(speaker_entity_picture).state;
            if (!pic.empty() && pic.rfind("http", 0) != 0) {
              pic = std::string("${ha_url}") + pic;
            }
            return pic;

lvgl:
  pages:
    # Redesigned for the 800x480 landscape canvas (rotation: 90 in
    # device/lvgl.yaml turns the native 480x800 portrait panel sideways).
    # The now-playing section is a ROW (art beside text) instead of a COLUMN,
    # since height is the scarce dimension here, not width.
    - id: music_page
      layout:
        type: flex
        flex_flow: column
        pad_row: 28
      width: 100%
      scrollable: false
      bg_color: Black
      bg_opa: cover
      pad_top: 24
      pad_bottom: 4
      pad_left: 10
      pad_right: 10

      widgets:
        # --- Now playing --- (row: art beside text)
        - obj:
            layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center, pad_column: 14}
            width: 100%
            height: 100
            pad_all: 0
            scrollable: false
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - image:
                  id: cover_art_widget
                  src: cover_art
                  width: 96
                  height: 96
              - obj:
                  layout: {type: flex, flex_flow: column, flex_align_cross: start}
                  flex_grow: 1
                  height: SIZE_CONTENT
                  scrollable: false
                  bg_opa: TRANSP
                  border_width: 0
                  widgets:
                    - label:
                        id: media_title_label
                        text: "Nothing playing"
                        text_font: label_font
                        text_color: 0xFFFFFF
                    - label:
                        id: media_artist_label
                        text: ""
                        text_font: label_font
                        text_color: 0xAAAAAA

        # --- Transport controls --- (height 78)
        # NOTE: homeassistant.action's `data:` fields must be STATIC. Runtime
        # (lambda-derived) values have to go through `variables:` + a Jinja
        # `data_template:` string that Home Assistant renders on receipt -
        # putting `!lambda` directly under `data:` silently does nothing.
        - obj:
            layout: {type: flex, flex_flow: row, flex_align_main: center, flex_align_cross: center, pad_column: 20}
            width: 100%
            height: 100
            pad_all: 0
            scrollable: false
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - button:
                  styles: control
                  height: 90
                  width: 90
                  pad_all: 3
                  widgets:
                    - label: {text_font: $icon_font, text: "\U000F04AE", align: center}   # skip-previous
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_previous_track
                        data_template:
                          entity_id: "media_player.loud_esp32"
              - button:
                  id: play_pause_button
                  styles: control
                  height: 90
                  width: 90
                  pad_all: 3
                  widgets:
                    - label: {id: play_pause_icon, text_font: $icon_font, text: "\U000F040A", align: center}
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_play_pause
                        data_template:
                          entity_id: "media_player.loud_esp32"
              - button:
                  styles: control
                  height: 90
                  width: 90
                  pad_all: 3
                  widgets:
                    - label: {text_font: $icon_font, text: "\U000F04AD", align: center}   # skip-next
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_next_track
                        data_template:
                          entity_id: "media_player.loud_esp32"

        # --- Volume --- (height 24)
        - slider:
            id: volume_slider
            width: 90%
            height: 24
            min_value: 0
            max_value: 100
            value: 50
            align: center
            on_release:
              - homeassistant.action:
                  action: media_player.volume_set
                  variables:
                    vol_value: !lambda 'return x / 100.0f;'
                  data_template:
                    entity_id: "media_player.loud_esp32"
                    volume_level: "{{ vol_value }}"

        # --- Playlist shortcuts (Music Assistant library IDs) --- (64px rows)
        - obj:
            layout: {type: flex, flex_flow: row_wrap, pad_row: 6, pad_column: 6}
            width: 100%
            height: SIZE_CONTENT
            pad_all: 0
            scrollable: false
            bg_opa: TRANSP
            border_width: 0
            widgets:
              - button:
                  styles: control
                  height: 64
                  width: 136
                  pad_all: 6
                  widgets:
                    - label: {text: "Megadeth", width: 100%, long_mode: DOT, text_align: center}
                  on_click:
                    - homeassistant.action:
                        action: media_player.play_media
                        data_template:
                          entity_id: "media_player.loud_esp32"
                          media_content_type: "playlist"
                          media_content_id: "library://playlist/11"
              - button:
                  styles: control
                  height: 64
                  width: 136
                  pad_all: 6
                  widgets:
                    - label: {text: "Avenged Sevenfold", width: 100%, long_mode: DOT, text_align: center}
                  on_click:
                    - homeassistant.action:
                        action: media_player.play_media
                        data_template:
                          entity_id: "media_player.loud_esp32"
                          media_content_type: "playlist"
                          media_content_id: "library://playlist/26"
              - button:
                  styles: control
                  height: 64
                  width: 136
                  pad_all: 6
                  widgets:
                    - label: {text: "The Killers", width: 100%, long_mode: DOT, text_align: center}
                  on_click:
                    - homeassistant.action:
                        action: media_player.play_media
                        data_template:
                          entity_id: "media_player.loud_esp32"
                          media_content_type: "playlist"
                          media_content_id: "library://playlist/28"
              - button:
                  styles: control
                  height: 64
                  width: 136
                  pad_all: 6
                  widgets:
                    - label: {text: "Good Stuff", width: 100%, long_mode: DOT, text_align: center}
                  on_click:
                    - homeassistant.action:
                        action: media_player.play_media
                        data_template:
                          entity_id: "media_player.loud_esp32"
                          media_content_type: "playlist"
                          media_content_id: "library://playlist/27"
              - button:
                  styles: control
                  height: 64
                  width: 136
                  pad_all: 6
                  widgets:
                    - label: {text: "Metallica", width: 100%, long_mode: DOT, text_align: center}
                  on_click:
                    - homeassistant.action:
                        action: media_player.play_media
                        data_template:
                          entity_id: "media_player.loud_esp32"
                          media_content_type: "playlist"
                          media_content_id: "library://playlist/23"
              - button:
                  styles: control
                  height: 64
                  width: 136
                  pad_all: 6
                  widgets:
                    - label: {text: "Muse", width: 100%, long_mode: DOT, text_align: center}
                  on_click:
                    - homeassistant.action:
                        action: media_player.play_media
                        data_template:
                          entity_id: "media_player.loud_esp32"
                          media_content_type: "playlist"
                          media_content_id: "library://playlist/135"
