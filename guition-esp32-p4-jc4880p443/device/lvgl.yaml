lvgl:
  buffer_size: 100%
  byte_order: little_endian
  displays: my_display
  touchscreens: my_touchscreen

  top_layer:
    widgets:
      # Clock (kept from the original template; delete this block if you
      # don't want it). The office/outdoor temperature labels were dropped
      # since they referenced sensors specific to the original author's house.
      - label:
          text: "--:--"
          id: display_time
          text_font: clockbar_font
          align: top_mid
          x: 0
          y: 2
          text_align: center
          text_color: 0xFFFFFF

  # No `pages:` here anymore - device/media.yaml's `music_page` is now the
  # only page defined across the whole config, so it's the default/boot page.
